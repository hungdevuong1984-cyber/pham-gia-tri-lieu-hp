<title>Trung Tâm Trị Liệu Phạm Gia</title>
<style>
:root{--green:#173d32;--gold:#d8b66a;--ink:#20302b}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(145deg,#edf3ed,#f7f2e7);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);display:grid;place-items:center;padding:24px}
main{width:min(100%,440px);background:#fff;border-radius:24px;padding:30px 22px;box-shadow:0 14px 45px #173d3218;text-align:center}
.mark{width:70px;height:70px;margin:0 auto 16px;border:2px solid var(--gold);border-radius:50%;display:grid;place-items:center;color:var(--green);font-size:28px;font-weight:800}
h1{font-size:24px;line-height:1.2;margin:0;color:var(--green)}
.sub{margin:10px 0 24px;color:#66736d;font-size:14px}
a{display:flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;border-radius:14px;padding:15px 16px;margin:11px 0;font-weight:700;border:1px solid #e3e9e4;color:var(--green);background:#f8faf8}
a.primary{background:var(--green);color:white;border-color:var(--green)}
a:focus{outline:3px solid #d8b66a}
.addr{margin:22px 0 4px;font-size:14px;line-height:1.5;color:#5e6b64}
footer{font-size:12px;color:#849087;margin-top:18px}
</style>
</head>
